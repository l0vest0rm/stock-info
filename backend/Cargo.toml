[package]
name = "stock-info-local"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
llm-client = { path = "../../input-helper/input-gateway/crates/llm-client" }
acquisition = { path = "../../sub2me/crates/acquisition", features = ["app-capture"] }
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
dotenvy = "0.15"
encoding_rs = "0.8"
lopdf = "0.40"
base64 = "0.22"
percent-encoding = "2"
ryu-js = "1"
futures-util = "0.3"
flate2 = "1"
brotli = "8"
tokio-tungstenite = "0.28"
tempfile = "3"
rusqlite = { version = "=0.41.1", features = ["bundled", "backup"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "brotli", "deflate"] }
sha2 = "0.10"
regex = "1"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "sync", "time", "process", "io-util"] }
tower-http = { version = "0.6", features = ["fs"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

