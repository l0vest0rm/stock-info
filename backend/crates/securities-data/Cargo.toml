[package]
name = "securities-data"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
chrono = "0.4"
chrono-tz = "0.10"
encoding_rs = "0.8"
lopdf = "0.40"
regex = "1"
ryu-js = "1"
reqwest = { version = "0.12", default-features = false }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "macros", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
